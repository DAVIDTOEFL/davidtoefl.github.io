<head>

<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --sub:#6b7280;
    --brand:#4f46e5; --brand-dark:#4338ca; --brand-soft:#eef2ff;
    --good:#059669; --good-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
    --border:#e5e7eb; --star:#f59e0b;
    --radius:16px; --shadow:0 2px 10px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
  }
  #app{max-width:720px; margin:0 auto; padding:16px 16px 64px;}
  header.top{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; margin:0 -16px 8px; border-bottom:1px solid var(--border);
  }
  header.top h1{font-size:17px; margin:0; font-weight:800; letter-spacing:-.2px; cursor:pointer;}
  header.top .nav-btns{display:flex; gap:8px;}
  .icon-btn{
    border:1px solid var(--border); background:var(--card); border-radius:10px;
    padding:8px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .icon-btn.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px;}
  .badge.wrong{background:var(--bad-soft); color:var(--bad);}
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px; margin-bottom:14px; border:1px solid rgba(15,23,42,.03);
  }
  .section-title{font-size:14px; font-weight:800; color:var(--sub); margin:22px 2px 10px; text-transform:uppercase; letter-spacing:.4px;}
  .summary-card{
    background:linear-gradient(135deg, var(--brand), #7c6ef0); color:#fff;
    border-radius:var(--radius); padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .summary-card .big{font-size:26px; font-weight:800;}
  .summary-card .small{font-size:13px; opacity:.9; margin-top:4px;}
  .progress-bar{background:rgba(255,255,255,.3); height:8px; border-radius:99px; margin-top:12px; overflow:hidden;}
  .progress-bar > div{background:#fff; height:100%; border-radius:99px; transition:width .3s;}
  .day-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:10px;}
  .day-cell{
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 6px;
    text-align:center; cursor:pointer; position:relative; transition:transform .1s;
  }
  .day-cell:active{transform:scale(.96);}
  .day-cell .num{font-weight:800; font-size:15px;}
  .day-cell .range{font-size:10px; color:var(--sub); margin-top:2px;}
  .day-cell.done{background:var(--good-soft); border-color:#a7f3d0;}
  .day-cell.done .num{color:var(--good);}
  .day-cell .score-chip{font-size:10px; font-weight:700; color:var(--good); margin-top:2px;}
  .btn{
    display:block; width:100%; text-align:center; padding:14px; border-radius:12px; border:none;
    font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{background:var(--brand-soft); color:var(--brand-dark);}
  .btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--border);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{margin-bottom:0;}
  .word-title{font-size:26px; font-weight:800; letter-spacing:-.3px;}
  .star{color:var(--star); font-size:14px;}
  .speak-btn{
    border:none; background:var(--brand-soft); color:var(--brand-dark); width:38px; height:38px;
    border-radius:50%; font-size:16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  }
  .flash-wrap{perspective:1200px; margin-bottom:16px;}
  .flash-card{
    min-height:220px; border-radius:var(--radius); box-shadow:var(--shadow); cursor:pointer;
    position:relative; transform-style:preserve-3d; transition:transform .45s;
  }
  .flash-card.flipped{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
    background:var(--card); padding:22px; display:flex; flex-direction:column; justify-content:center;
  }
  .flash-face.back{transform:rotateY(180deg); background:var(--brand-soft);}
  .flash-hint{font-size:12px; color:var(--sub); text-align:center; margin-top:-6px; margin-bottom:14px;}
  .kr-meaning{font-size:19px; font-weight:700; margin-top:6px;}
  .syn-line{font-size:13px; color:var(--sub); margin-top:10px;}
  .ant-line{font-size:12px; color:#b45309; margin-top:6px;}
  .qn-progress{font-size:12px; color:var(--sub); margin-bottom:6px; font-weight:600;}
  .choice-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:14px;
    border-radius:12px; border:1.5px solid var(--border); background:var(--card);
    font-size:15px; margin-bottom:10px; cursor:pointer; font-weight:600;
  }
  .choice-btn:active{transform:scale(.99);}
  .choice-btn.correct{background:var(--good-soft); border-color:var(--good); color:var(--good);}
  .choice-btn.incorrect{background:var(--bad-soft); border-color:var(--bad); color:var(--bad);}
  .choice-letter{
    width:26px; height:26px; border-radius:50%; background:var(--brand-soft); color:var(--brand-dark);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;
  }
  input.spell-input{
    width:100%; padding:14px; font-size:18px; border-radius:12px; border:1.5px solid var(--border);
    margin-bottom:12px; font-family:inherit;
  }
  input.spell-input.correct{border-color:var(--good); background:var(--good-soft);}
  input.spell-input.incorrect{border-color:var(--bad); background:var(--bad-soft);}
  .feedback-box{
    padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:12px; font-weight:600;
  }
  .feedback-box.correct{background:var(--good-soft); color:var(--good);}
  .feedback-box.incorrect{background:var(--bad-soft); color:var(--bad);}
  .wrong-item{
    display:flex; justify-content:space-between; align-items:center; padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item .w{font-weight:700;}
  .wrong-item .k{font-size:13px; color:var(--sub);}
  .streak-dots{display:flex; gap:3px; margin-top:4px;}
  .streak-dots span{width:7px; height:7px; border-radius:50%; background:var(--border);}
  .streak-dots span.on{background:var(--good);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--sub);}
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 2px;}
  .switch{position:relative; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  input:checked + .slider{background:var(--brand);}
  input:checked + .slider:before{transform:translateX(18px);}
  .footer-note{text-align:center; font-size:11px; color:var(--sub); margin-top:26px;}
  .legal-footer{
    max-width:720px; margin:18px auto 0; padding:14px 20px 26px; text-align:center;
    font-size:10.5px; line-height:1.6; color:#9ca3af; border-top:1px solid var(--border);
  }
  @media (max-width:380px){
    .word-title{font-size:22px;}
    .day-grid{grid-template-columns:repeat(auto-fill, minmax(72px,1fr));}
  }
</style>

const PER_DAY = 30;

/* ================== STORAGE ================== */
const STORE_KEY_PROGRESS = 'vocabApp_progress_v1';
const STORE_KEY_NOTEBOOK = 'vocabApp_notebook_v1';
const STORE_KEY_SETTINGS = 'vocabApp_settings_v1';

function safeGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function safeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* ignore (private mode / sandbox) */ }
}

let progress = safeGet(STORE_KEY_PROGRESS, {});     // { dayIdx: {bestScore, lastScore, total, done, date, attempts} }
let notebook = safeGet(STORE_KEY_NOTEBOOK, {});      // { word: {word, kr, en, day, streak, wrongCount, added} }
let settings = safeGet(STORE_KEY_SETTINGS, {autoTTS:true});

function saveProgress(){ safeSet(STORE_KEY_PROGRESS, progress); }
function saveNotebook(){ safeSet(STORE_KEY_NOTEBOOK, notebook); }
function saveSettings(){ safeSet(STORE_KEY_SETTINGS, settings); }

/* ================== DAY CHUNKING ================== */
const TOTAL_DAYS = Math.ceil(WORDS.length / PER_DAY);
function dayWords(dayIdx){
  const start = dayIdx*PER_DAY;
  return WORDS.slice(start, start+PER_DAY);
}

/* ================== TTS ================== */
let voiceList = [];
function loadVoices(){ voiceList = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
function hasEnglishVoice(){ return voiceList.some(v => v.lang && v.lang.toLowerCase().startsWith('en')); }
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  // 원인 확인: 이 컴퓨터(Windows)에는 로컬 음성이 한국어(Microsoft Heami)뿐이고,
  // 영어 음성은 크롬이 인터넷을 통해 뒤늦게 불러오는 "온라인 음성" 목록에만 있었습니다.
  // 그런데 그 온라인 목록이 도착하기 "전에" 재생 버튼을 누르면, 영어 음성이 하나도 없어서
  // 브라우저가 언어 설정(en-US)을 무시하고 시스템 기본 음성(한국어)으로 읽어버리는 문제였습니다.
  // 그래서 페이지가 열리자마자 몇 초간 반복해서 목록을 다시 확인해, 온라인 음성이 도착하는 대로 바로 잡아둡니다.
  let pollCount = 0;
  const voicePoll = setInterval(() => {
    loadVoices();
    pollCount++;
    if(hasEnglishVoice() || pollCount > 24) clearInterval(voicePoll); // 최대 약 12초간 재시도
  }, 500);
}
// 브라우저마다, 그리고 파일을 연 방식(내 컴퓨터 파일 vs. 웹사이트 링크)에 따라
// speechSynthesis가 돌려주는 목소리 목록의 "순서"가 달라질 수 있어서,
// 그냥 첫 번째 영어 목소리를 고르면 어떨 때는 자연스러운 목소리, 어떨 때는
// 로봇처럼 들리는 저품질 목소리가 뽑히는 문제가 있었습니다.
// 이름으로 알려진 고품질 목소리를 우선순위로 직접 지정해서 항상 같은(가장 좋은) 목소리가 나오도록 고쳤습니다.
const PREFERRED_VOICE_NAMES = [
  'Google US English',
  'Microsoft Aria Online (Natural)',
  'Microsoft Jenny Online (Natural)',
  'Microsoft Guy Online (Natural)',
  'Microsoft Ava Online (Natural)',
  'Samantha',
  'Alex'
];
function pickBestVoice(){
  loadVoices(); // 매번 호출 시점에 다시 읽어서, 목록이 늦게 로드되는 문제를 방지
  if(!voiceList.length) return null;
  for(const name of PREFERRED_VOICE_NAMES){
    const v = voiceList.find(v => v.name === name);
    if(v) return v;
  }
  const usVoice = voiceList.find(v => v.lang === 'en-US');
  if(usVoice) return usVoice;
  return voiceList.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
}
// 영어 음성이 아직 로드되지 않았다면 (최대 2.5초까지) 잠깐 기다렸다가 재생합니다.
// 이렇게 해야 "영어 음성이 아직 없어서 한국어 음성으로 읽히는" 문제가 재발하지 않습니다.
function waitForEnglishVoice(maxWaitMs){
  maxWaitMs = maxWaitMs || 2500;
  return new Promise(resolve => {
    loadVoices();
    if(hasEnglishVoice()){ resolve(); return; }
    const startedAt = Date.now();
    const waitTimer = setInterval(() => {
      loadVoices();
      if(hasEnglishVoice() || Date.now() - startedAt > maxWaitMs){
        clearInterval(waitTimer);
        resolve();
      }
    }, 150);
  });
}
async function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    await waitForEnglishVoice();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    const bestVoice = pickBestVoice();
    if(bestVoice) u.voice = bestVoice;
    window.speechSynthesis.speak(u);
  }catch(e){ /* ignore */ }
}
function speakWithVoice(text, voice){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    if(voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }catch(e){ /* ignore */ }
}
// 발음이 이상할 때 원인을 눈으로 확인할 수 있도록 만든 진단 화면.
// 이 브라우저가 실제로 갖고 있는 목소리 목록과, 그 중 앱이 자동으로 고르는 목소리를 보여줍니다.
function showVoiceDebug(){
  const overlay = document.getElementById('voiceDebugOverlay');
  const body = document.getElementById('voiceDebugBody');
  if(!overlay || !body) return;
  loadVoices();
  const chosen = pickBestVoice();
  let html = '';
  html += '<div><b>주소 형식:</b> ' + escapeHtml(location.protocol) + '</div>';
  html += '<div><b>브라우저:</b> ' + escapeHtml(navigator.userAgent) + '</div>';
  html += '<div><b>사용 가능한 영어 목소리 수:</b> ' + voiceList.filter(v=>v.lang&&v.lang.startsWith('en')).length + ' / 전체 ' + voiceList.length + '개</div>';
  html += '<div style="margin-top:8px;"><b>👉 지금 자동으로 선택된 목소리:</b> ' + (chosen ? escapeHtml(chosen.name)+' ('+escapeHtml(chosen.lang)+(chosen.localService?', 로컬':', 온라인')+')' : '없음 (기기 기본 목소리 사용)') + '</div>';
  if(!chosen){
    html += '<div style="margin-top:8px;padding:8px 10px;background:#fef2f2;color:#b91c1c;border-radius:8px;">아직 영어 목소리를 찾지 못했습니다. 인터넷 연결을 확인하고 몇 초 기다린 뒤 다시 눌러주세요 — 이제 앱이 재생 전 최대 2.5초까지 자동으로 기다리도록 고쳐졌습니다.</div>';
  }
  html += '<div style="margin-top:12px;"><button onclick="speakWithVoice(\'This is a test sentence.\', null)" style="padding:6px 12px;border-radius:6px;border:1px solid #ccc;cursor:pointer;">▶ 지금 선택된 목소리로 듣기</button></div>';
  if(voiceList.length){
    html += '<div style="margin-top:14px;"><b>전체 목소리 목록 (재생 버튼으로 직접 비교해보세요):</b></div>';
    html += '<div style="max-height:260px;overflow:auto;border:1px solid #eee;border-radius:8px;margin-top:6px;">';
    voiceList.forEach((v, i) => {
      const isEn = v.lang && v.lang.startsWith('en');
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;'+(isEn?'background:#f8fafc;':'')+'border-bottom:1px solid #f1f1f1;">';
      html += '<span>'+(i+1)+'. '+escapeHtml(v.name)+' <span style="color:#9ca3af;">('+escapeHtml(v.lang)+(v.localService?', 로컬':', 온라인')+')</span></span>';
      html += '<button onclick="speakWithVoice(\'This is a test sentence.\', voiceList['+i+'])" style="padding:3px 8px;border-radius:6px;border:1px solid #ccc;cursor:pointer;font-size:12px;">▶</button>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="margin-top:14px;color:#b91c1c;">이 브라우저에서 목소리 목록을 하나도 받아오지 못했습니다. 잠시 후 다시 열어보시거나, 페이지를 새로고침한 뒤 다시 시도해주세요.</div>';
  }
  body.innerHTML = html;
  overlay.style.display = 'block';
}

/* ================== HELPERS ================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starStr(freq){ return freq>0 ? '★'.repeat(freq) : ''; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalize(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }

/* ================== APP STATE / ROUTER ================== */
const app = document.getElementById('app');
let state = { view:'home' };

function go(view, extra){
  state = Object.assign({view}, extra||{});
  window.scrollTo(0,0);
  render();
}

function render(){
  if(state.view==='home') return renderHome();
  if(state.view==='day') return renderDayMenu(state.dayIdx);
  if(state.view==='flash') return renderFlash(state.dayIdx, state.pos||0, state.flipped||false);
  if(state.view==='quiz') return renderQuiz();
  if(state.view==='result') return renderResult();
  if(state.view==='notebook') return renderNotebook();
  if(state.view==='notebook-quiz') return renderQuiz();
  renderHome();
}

function header(activeTab){
  return `
  <header class="top">
    <h1 onclick="go('home')">📚 David TOEFL <span style="font-weight:600; color:var(--sub); font-size:12px;">매일 30단어 시험</span></h1>
    <div class="nav-btns">
      <button class="icon-btn ${activeTab==='home'?'active':''}" onclick="go('home')">홈</button>
      <button class="icon-btn ${activeTab==='notebook'?'active':''}" onclick="go('notebook')">오답노트${Object.keys(notebook).length? ' '+Object.keys(notebook).length : ''}</button>
    </div>
  </header>`;
}

/* ================== HOME ================== */
function renderHome(){
  const doneDays = Object.values(progress).filter(p=>p.done).length;
  const totalWrong = Object.keys(notebook).length;
  let cells = '';
  for(let d=0; d<TOTAL_DAYS; d++){
    const p = progress[d];
    const start = d*PER_DAY+1, end = Math.min((d+1)*PER_DAY, WORDS.length);
    const doneClass = p && p.done ? 'done' : '';
    const scoreChip = p && p.done ? `<div class="score-chip">${p.lastScore}/${p.total}</div>` : '';
    cells += `<div class="day-cell ${doneClass}" onclick="go('day',{dayIdx:${d}})">
        <div class="num">Day ${d+1}</div>
        <div class="range">${start}-${end}</div>
        ${scoreChip}
      </div>`;
  }
  app.innerHTML = `
    ${header('home')}
    <div class="summary-card">
      <div class="small">전체 학습 진행률</div>
      <div class="big">${doneDays} / ${TOTAL_DAYS} Day 완료</div>
      <div class="small">전체 단어 ${WORDS.length}개 · 오답노트 ${totalWrong}개</div>
      <div class="progress-bar"><div style="width:${TOTAL_DAYS? (doneDays/TOTAL_DAYS*100):0}%"></div></div>
    </div>
    <div class="section-title">Day 선택 (하루 30개씩)</div>
    <div class="day-grid">${cells}</div>
    <div class="footer-note">토플 기출단어모음 · 총 ${TOTAL_DAYS}일 코스 · 오늘 하루 30개씩 시험 보고, 틀린 단어는 오답노트에서 다시 복습하세요.<br>David TOEFL 제작 · Made by David</div>
  `;
}

/* ================== DAY MENU ================== */
function renderDayMenu(dayIdx){
  const words = dayWords(dayIdx);
  const p = progress[dayIdx];
  app.innerHTML = `
    ${header('home')}
    <div class="card">
      <div style="font-weight:800; font-size:19px; margin-bottom:4px;">Day ${dayIdx+1}</div>
      <div style="color:var(--sub); font-size:13px; margin-bottom:16px;">단어 ${words.length}개 ${p && p.done ? ' · 완료 (최고 '+p.bestScore+'/'+p.total+')' : ' · 미완료'}</div>
      <button class="btn btn-secondary" onclick="startFlash(${dayIdx})">🗂️ 플래시카드로 학습하기</button>
      <button class="btn btn-primary" onclick="startQuiz(${dayIdx})">✏️ Day ${dayIdx+1} 단어시험 시작 (30문제)</button>
      <button class="btn btn-ghost" onclick="go('home')">홈으로</button>
    </div>

}

/* ================== FLASHCARDS ================== */
function startFlash(dayIdx){ go('flash', {dayIdx, pos:0, flipped:false}); }
function renderFlash(dayIdx, pos, flipped){
  const words = dayWords(dayIdx);
  const w = words[pos];
  const [word, freq, en, kr, ant] = w;
  app.innerHTML = `
    ${header('home')}
    <div class="qn-progress">Day ${dayIdx+1} · 플래시카드 ${pos+1} / ${words.length}</div>
    <div class="flash-wrap">
      <div class="flash-card ${flipped?'flipped':''}" onclick="flipCard()">
        <div class="flash-face front">
          <div class="word-title">${escapeHtml(word)} <span class="star">${starStr(freq)}</span></div>
          <div style="margin-top:14px;"><button class="speak-btn" onclick="event.stopPropagation(); speak('${escapeHtml(word).replace(/'/g,"\\'")}')">🔊</button></div>
          <div class="flash-hint" style="margin-top:16px;">카드를 탭하면 뜻이 보여요</div>
        </div>
        <div class="flash-face back">
          <div class="kr-meaning">${escapeHtml(kr)}</div>
          ${en ? `<div class="syn-line">유의어: ${escapeHtml(en)}</div>` : ''}
          ${ant ? `<div class="ant-line">반의어: ${escapeHtml(ant)}</div>` : ''}
        </div>
      </div>
    </div>

      <button class="btn btn-ghost" ${pos===0?'disabled':''} onclick="flashNav(${dayIdx},${pos-1})">◀ 이전</button>
      <button class="btn btn-primary" onclick="flashNav(${dayIdx},${pos+1})">${pos+1>=words.length? '시험 보기 →' : '다음 ▶'}</button>
    </div>
  `;
  if(settings.autoTTS) speak(word);
}
function flipCard(){ state.flipped = !state.flipped; render(); }
function flashNav(dayIdx, newPos){
  const words = dayWords(dayIdx);
  if(newPos >= words.length){ startQuiz(dayIdx); return; }
  if(newPos < 0) return;
  go('flash', {dayIdx, pos:newPos, flipped:false});
}

/* ================== QUIZ ENGINE ================== */
function buildQuizQuestions(words, poolForDistractors){
  return words.map(w=>{
    const [word, freq, en, kr, ant] = w;
    const type = Math.random() < 0.5 ? 'en2kr' : 'kr2en';
    let choices = null;
    if(type==='en2kr'){
      const distractors = shuffle(poolForDistractors.filter(x=>x[0]!==word)).slice(0,3).map(x=>x[3]);
      choices = shuffle([kr, ...distractors]);
    } else {
      const distractors = shuffle(poolForDistractors.filter(x=>x[0]!==word)).slice(0,3).map(x=>x[0]);
      choices = shuffle([word, ...distractors]);
    }
    return {word, freq, en, kr, ant, type, choices, userAnswer:null, isCorrect:null};
  });
}

function startQuiz(dayIdx){
  const words = dayWords(dayIdx);
  const questions = buildQuizQuestions(words, words.length>=4? words : WORDS);
  go('quiz', {mode:'day', dayIdx, questions, qi:0, score:0, wrongList:[]});
}

function startNotebookQuiz(){
  const words = Object.values(notebook).map(n => [n.word, 0, n.en||'', n.kr, n.ant||'']);
  if(words.length===0) return;
  const pool = words.length>=4 ? words : WORDS;
  const questions = buildQuizQuestions(shuffle(words), pool);
  go('quiz', {mode:'notebook', questions, qi:0, score:0, wrongList:[]});
}

function renderQuiz(){
  const {questions, qi} = state;
  const q = questions[qi];
  const total = questions.length;
  let body = '';
  if(q.type==='en2kr'){
    body = `
      <div class="card">
        <div class="word-title">${escapeHtml(q.word)} <span class="star">${starStr(q.freq)}</span>
          <button class="speak-btn" style="float:right;" onclick="speak('${escapeHtml(q.word).replace(/'/g,"\\'")}')">🔊</button>
        </div>
        <div style="color:var(--sub); font-size:13px; margin-top:6px;">이 단어의 뜻으로 알맞은 것을 고르세요</div>
      </div>
      <div id="choices">
        ${q.choices.map((c,i)=>{
          let cls='';
          if(q.userAnswer!==null){
            if(c===q.kr) cls='correct';
            else if(c===q.userAnswer) cls='incorrect';
          }
          return `<button class="choice-btn ${cls}" ${q.userAnswer!==null?'disabled':''} onclick="answerChoice(${i})">
            <span class="choice-letter">${String.fromCharCode(65+i)}</span> ${escapeHtml(c)}
          </button>`;
        }).join('')}
      </div>
    `;
  } else {
    body = `
      <div class="card">
        <div style="color:var(--sub); font-size:13px; margin-bottom:6px;">이 뜻에 맞는 영어 단어를 고르세요</div>
        <div class="kr-meaning">${escapeHtml(q.kr)}</div>
      </div>
      <div id="choices">
        ${q.choices.map((c,i)=>{
          let cls='';
          if(q.userAnswer!==null){
            if(c===q.word) cls='correct';
            else if(c===q.userAnswer) cls='incorrect';
          }
          return `<button class="choice-btn ${cls}" ${q.userAnswer!==null?'disabled':''} onclick="answerChoice(${i})">
            <span class="choice-letter">${String.fromCharCode(65+i)}</span> ${escapeHtml(c)}
          </button>`;
        }).join('')}
      </div>
      ${q.userAnswer!==null ? `<div class="feedback-box ${q.isCorrect?'correct':'incorrect'}">
          ${q.isCorrect? '정답이에요! 🎉' : '정답: '+escapeHtml(q.word)}
          <button class="speak-btn" style="margin-left:8px;" onclick="speak('${escapeHtml(q.word).replace(/'/g,"\\'")}')">🔊</button>
        </div>` : ''}
    `;
  }
  app.innerHTML = `
    ${header('home')}
    <div class="qn-progress">${state.mode==='notebook'?'오답노트 복습':('Day '+(state.dayIdx+1)+' 단어시험')} · ${qi+1} / ${total}</div>
    ${body}
    ${q.userAnswer!==null ? `<button class="btn btn-primary" onclick="nextQuestion()">${qi+1>=total? '결과 보기' : '다음 문제'}</button>` : ''}
  `;
}

function answerChoice(i){
  const q = state.questions[state.qi];
  if(q.userAnswer!==null) return;
  q.userAnswer = q.choices[i];
  const target = q.type==='en2kr' ? q.kr : q.word;
  q.isCorrect = (q.userAnswer === target);
  registerAnswer(q);
  render();
}
function registerAnswer(q){
  if(q.isCorrect){
    state.score += 1;
    if(state.mode==='notebook' && notebook[q.word]){
      notebook[q.word].streak = (notebook[q.word].streak||0) + 1;
      if(notebook[q.word].streak >= 2){ delete notebook[q.word]; }
      saveNotebook();
    }
  } else {
    state.wrongList.push(q);
    const key = q.word;
    if(!notebook[key]) notebook[key] = {word:q.word, kr:q.kr, en:q.en, ant:q.ant, day:(state.dayIdx!=null? state.dayIdx+1:null), streak:0, wrongCount:0, added:Date.now()};
    notebook[key].wrongCount = (notebook[key].wrongCount||0)+1;
    notebook[key].streak = 0;
    saveNotebook();
  }
}
function nextQuestion(){
  if(state.qi+1 >= state.questions.length){
    // finish
    if(state.mode==='day'){
      const total = state.questions.length;
      const prev = progress[state.dayIdx];
      progress[state.dayIdx] = {
        total,
        lastScore: state.score,
        bestScore: prev ? Math.max(prev.bestScore, state.score) : state.score,
        done: true,
        attempts: prev ? (prev.attempts||0)+1 : 1,
        date: new Date().toISOString()
      };
      saveProgress();
    }
    go('result', {mode:state.mode, dayIdx:state.dayIdx, score:state.score, total:state.questions.length, wrongList:state.wrongList});
    return;
  }
  state.qi += 1;
  render();
}

/* ================== RESULT ================== */
function renderResult(){
  const {score, total, wrongList, mode, dayIdx} = state;
  const pct = total? Math.round(score/total*100) : 0;
  const emoji = pct>=90 ? '🏆' : pct>=70 ? '👍' : pct>=50 ? '💪' : '📖';
  app.innerHTML = `
    ${header('home')}
    <div class="summary-card">
      <div class="small">${mode==='notebook' ? '오답노트 복습 결과' : 'Day '+(dayIdx+1)+' 단어시험 결과'}</div>
      <div class="big">${emoji} ${score} / ${total} (${pct}%)</div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
    </div>
    ${wrongList.length ? `
      <div class="section-title">틀린 단어 (${wrongList.length})</div>
      <div class="card">
        ${wrongList.map(q=>`
          <div class="wrong-item">
            <div>
              <div class="w">${escapeHtml(q.word)}</div>
              <div class="k">${escapeHtml(q.kr)}</div>
            </div>
            <button class="speak-btn" onclick="speak('${escapeHtml(q.word).replace(/'/g,"\\'")}')">🔊</button>
          </div>
        `).join('')}
      </div>
    ` : `<div class="card" style="text-align:center; color:var(--good); font-weight:700;">🎉 전부 맞혔어요!</div>`}
    <button class="btn btn-primary" onclick="go('home')">홈으로</button>
    ${mode==='day' ? `<button class="btn btn-secondary" onclick="startQuiz(${dayIdx})">다시 시험보기</button>` : ''}
    ${Object.keys(notebook).length ? `<button class="btn btn-ghost" onclick="go('notebook')">오답노트 보러가기</button>` : ''}
  `;
}

/* ================== NOTEBOOK ================== */
function renderNotebook(){
  const items = Object.values(notebook).sort((a,b)=>b.added-a.added);
  app.innerHTML = `
    ${header('notebook')}
    <div class="card">
      <div class="toggle-row">
        <div>
          <div style="font-weight:800;">🔊 발음 자동재생</div>
          <div style="font-size:12px; color:var(--sub);">단어를 볼 때 자동으로 소리를 들려줘요</div>
        </div>
        <label class="switch"><input type="checkbox" ${settings.autoTTS?'checked':''} onchange="toggleAutoTTS(this.checked)"><span class="slider"></span></label>
      </div>
    </div>
    <div class="section-title">오답노트 (${items.length}개)</div>
    ${items.length ? `
      <button class="btn btn-primary" onclick="startNotebookQuiz()">✏️ 오답노트 전체 복습 시험 (${items.length}문제)</button>
      <div class="card">
        ${items.map(it=>`
          <div class="wrong-item">
            <div>
              <div class="w">${escapeHtml(it.word)}</div>
              <div class="k">${escapeHtml(it.kr)} ${it.day? '· Day '+it.day : ''}</div>
              <div class="streak-dots">${[0,1].map(i=>`<span class="${i<(it.streak||0)?'on':''}"></span>`).join('')}</div>
            </div>
            <button class="speak-btn" onclick="speak('${escapeHtml(it.word).replace(/'/g,"\\'")}')">🔊</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-ghost" style="color:var(--bad); border-color:var(--bad-soft);" onclick="resetNotebook()">🗑️ 오답노트 전체 초기화</button>
    ` : `
      <div class="empty-state">
        <div class="emoji">🎉</div>
        <div>오답노트가 비어있어요.<br>시험에서 틀린 단어가 자동으로 여기에 모여요.</div>
      </div>
    `}
    <div class="footer-note">복습 시험에서 같은 단어를 2번 연속 맞히면 오답노트에서 자동으로 사라져요.</div>
  `;
}
function toggleAutoTTS(v){ settings.autoTTS = v; saveSettings(); }
function resetNotebook(){
  const count = Object.keys(notebook).length;
  if(count===0) return;
  const ok = window.confirm(`오답노트에 있는 단어 ${count}개를 전부 지울까요?\n이 작업은 되돌릴 수 없어요.`);
  if(!ok) return;
  notebook = {};
  saveNotebook();
  render();
}

/* ================== INIT ================== */
render();
</script>
